    <!-- Anti-flash inline theme script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var pref = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && pref);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] dark:bg-[#0A0A0A] dark:text-[#F5F5F5] antialiased selection:bg-blue-100 selection:text-blue-900 font-sans min-h-screen overflow-x-hidden transition-colors duration-200">
